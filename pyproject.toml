[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profilelens"
version = "1.0.0"
description = "End-to-end AMD GPU kernel performance analysis: trace-driven hotspot detection, rocprofv3 hardware-counter profiling, and empirical per-dtype roofline ranking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.TXT", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15",
    "perfetto>=0.7",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
profilelens = "profilelens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["profilelens"]

[tool.hatch.build.targets.wheel.force-include]
"rocprof-patch" = "rocprof-patch"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
