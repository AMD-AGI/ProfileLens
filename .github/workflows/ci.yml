name: Package checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Check syntax and package
        run: |
          python -m pip install build
          python -X pycache_prefix="$RUNNER_TEMP/pycache" -m compileall -q profilelens hatch_build.py
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m pip install "$RUNNER_TEMP"/dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          profilelens --help
          profilelens version
